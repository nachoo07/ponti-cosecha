<style>
/* Layout: app de campo, una columna, botones grandes; tabs abajo como app móvil */
:root{
  --bg:#F1F5F9; --surface:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#E2E8F0;
  --accent:#547792; --accent-ink:#FFFFFF; --fog:#94A3B8; --crop:#0E9F6E; --crop-ink:#FFFFFF;
  --ok:#0E9F6E; --ok-bg:#D7F5E6; --warn:#8A5A0B; --warn-bg:#FBEFD9; --bad:#B42318; --bad-bg:#FBE4E1;
  --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Sora",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#1E293B; --ink:#F1F5F9; --muted:#94A3B8; --line:#334155;
  --accent:#8AB4C9; --accent-ink:#0F172A; --fog:#64748B; --crop:#0E9F6E; --crop-ink:#FFFFFF;
  --ok:#34D399; --ok-bg:#0C2E22; --warn:#F2C26B; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3D1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --ink:#F1F5F9; --muted:#94A3B8; --line:#334155;
  --accent:#8AB4C9; --accent-ink:#0F172A; --fog:#64748B; --crop:#0E9F6E; --crop-ink:#FFFFFF;
  --ok:#34D399; --ok-bg:#0C2E22; --warn:#F2C26B; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3D1C19; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.logo{height:44px;width:auto}
.logo.dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.light{display:none}:root:not([data-theme="light"]) .logo.dark{display:block}}
:root[data-theme="dark"] .logo.light{display:none}:root[data-theme="dark"] .logo.dark{display:block}
.ctx{text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.ctx b{color:var(--ink);font-weight:500}
.crop{display:inline-block;background:var(--crop);color:var(--crop-ink);font-weight:700;font-size:11px;letter-spacing:.6px;padding:2px 8px;border-radius:999px}
h2{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.4px;margin:0;text-wrap:balance}
.label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.dark{background:var(--accent);color:#fff;border-color:var(--accent)}
.card.dark .label,.card.dark .muted{color:rgba(255,255,255,.78)}
.muted{color:var(--muted)}
.big{font-family:var(--font-display);font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.chip small{font-size:11px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.chip .tag{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--accent)}
.chip[aria-pressed="true"] .tag{color:var(--crop)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kg{font-size:40px;font-weight:700;text-align:right;letter-spacing:-.5px;font-variant-numeric:tabular-nums;padding:12px 16px}
.btn{min-height:52px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:0 18px;background:var(--accent);color:#fff}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:18px;line-height:1}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-abierto{background:var(--crop);color:var(--crop-ink)}
.p-viaje{background:var(--warn-bg);color:var(--warn)}
.p-desc{background:var(--ok-bg);color:var(--ok)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.truck{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.truck:last-child{border-bottom:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:5}
nav .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:880px;width:100%}
nav button span{font-size:11px}
nav button{background:none;border:0;font:inherit;font-size:12px;font-weight:500;color:var(--muted);min-height:52px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);background:var(--bg)}
.sheet{border:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:9;max-width:90vw}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.testband{background:#FACA15;color:#1F2A37;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;letter-spacing:.2px}
.p-aprob{background:var(--ink);color:var(--bg)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:52px;min-height:30px;height:30px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:420px){.big{font-size:38px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- Desktop (barra lateral) ---------- */
.nav-brand,.nav-exit{display:none}
@media (min-width:980px){
  nav{position:fixed;top:0;left:0;width:244px;height:100vh;overflow-y:auto;border-top:0;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:10}
  nav .nav-brand{display:flex;flex-direction:row;align-items:center;gap:11px;padding:4px 8px 16px;margin:0 0 12px;border-bottom:1px solid var(--line)}
  nav .nav-brand img{height:34px;width:auto;object-fit:contain;flex:0 0 auto}
  nav .nav-brand span{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1;color:var(--ink)}
  nav .in{display:flex;flex-direction:column;gap:4px;max-width:100%}
  nav button{flex-direction:row;justify-content:flex-start;gap:13px;min-height:50px;border-radius:12px;padding:0 13px;font-size:17px;font-weight:500}
  nav button svg{width:23px;height:23px}
  nav button[aria-current="page"]{background:rgba(84,119,146,.12);color:var(--accent)}
  nav .nav-exit{display:flex;align-items:center;gap:13px;margin-top:auto;min-height:50px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);font:inherit;font-size:17px;font-weight:500;cursor:pointer;padding:15px 13px 0}
  body{display:block}
  .wrap{max-width:none;margin-left:244px;padding:22px 40px 48px}
  .gated .wrap{margin-left:0}
  .wrap header{border-bottom:1px solid var(--line);padding-bottom:16px}
  .wrap header .logo{display:none}
  #logout{display:none!important}
  #view{max-width:none;margin:0}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
}
.card-h{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink)}
.tolva-grid{display:flex;flex-direction:column;gap:16px}
.col-cam{display:flex;flex-direction:column;gap:16px}
.tolva-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.tolva-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{gap:10px}
@media (min-width:980px){
  .tolva-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:start}
  .tolva-grid .col-reg{order:-1}
}
.desk-only{display:none}
.chips-stack{flex-direction:column}
.chips-stack .chip{width:100%;flex-direction:row;justify-content:space-between;align-items:center;min-height:46px}
.cam-grid{display:flex;flex-direction:column;gap:16px}
.cam-table th,.cam-table td{text-align:left;white-space:nowrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.cam-table tr:last-child td{border-bottom:0}
@media (min-width:980px){
  .desk-only{display:block}.mob-only{display:none}
  .cam-grid{display:grid;grid-template-columns:0.92fr 1.04fr 1.04fr;gap:24px;align-items:start}
}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;width:100%}
.login-card{max-width:440px;width:100%;gap:18px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:8px}
.login-brand b{font-family:var(--font-display);font-size:18px}
.logo-lg{height:56px;width:auto}
.login-inner{width:100%;gap:14px}
.ctxbar{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ctxbar .ctx-camp{color:var(--muted);font-size:12px}
@media (min-width:980px){
  header .headright{flex:1;align-items:stretch!important}
  .ctxbar{flex-direction:row;justify-content:space-between;align-items:center;width:100%}
  .ctxbar .ctx-proj{font-size:16px}
  .ctxbar .ctx-proj b{font-family:var(--font-display);font-weight:600}
}
.sheet-chip{border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--muted);font-weight:500;background:var(--surface)}
.cfg-grid{display:flex;flex-direction:column;gap:16px}
.cfg-head{display:grid;grid-template-columns:1fr 120px 34px;gap:10px;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.cfg-row{display:grid;grid-template-columns:1fr 120px 34px;gap:10px;align-items:center;margin-bottom:8px}
.cfg-del{width:34px;height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.cfg-del:hover{color:var(--bad);border-color:var(--bad)}
.cfg-num{position:relative;display:flex;align-items:center}
.cfg-num .cfg-in{padding-right:34px;text-align:right}
.cfg-suf{position:absolute;right:12px;color:var(--muted);font-size:13px;pointer-events:none}
@media (min-width:980px){.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const t=n=>fmt((n||0)/1000,1);
const today=()=>new Date().toISOString().slice(0,10);
const hora=iso=>{try{return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
const dia=s=>s?s.split('-').reverse().slice(0,2).join('/'):'—';

const S={db:null,user:null,dl:null,uid:null,cfg:null,tolvas:[],camiones:[],avance:{},tab:'tolva',lote:null,kg:'',edit:null,filter:'todos',confirm:null,ready:false,err:null};
S.R={tolvas:[],camiones:[],avance:{}};S.P={tolvas:[],camiones:[],avance:{}};S.names={};

/* ---------- Firebase (base compartida + login) ---------- */
const firebaseConfig={apiKey:"AIzaSyC5BS6yHaXtL3KV8tSh9bv9oEM0k8B4vBU",authDomain:"ponti-cosecha.firebaseapp.com",projectId:"ponti-cosecha",storageBucket:"ponti-cosecha.firebasestorage.app",messagingSenderId:"758356284025",appId:"1:758356284025:web:4c78f80221cad4ca35baa8"};
let FB=null;window.FBOK=false;
try{firebase.initializeApp(firebaseConfig);FB={auth:firebase.auth(),db:firebase.firestore()};window.FBOK=true;try{FB.db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(_){}}catch(e){console.error('Firebase no disponible',e);}
const prueba=()=>!!S.cfg?.modoPrueba;
const col=n=>(prueba()?'p_':'')+n;
function syncMode(){const b=prueba()?S.P:S.R;S.tolvas=b.tolvas;S.camiones=b.camiones;S.avance=b.avance;resolveNames();}
async function resolveNames(){if(!S.user)return;const ids=[...new Set(S.camiones.map(c=>c.aprobadoPor).filter(x=>x&&!(x in S.names)))];if(!ids.length)return;try{const ps=await S.user.profiles(ids);ids.forEach(i=>S.names[i]=(ps[i]&&ps[i].name)||'');render();}catch(_){}}
const quien=id=>id?(S.names[id]||'alguien del equipo'):'';
try{const tb=localStorage.getItem('ponti-cosecha-tab');if(tb)S.tab=tb;const lt=localStorage.getItem('ponti-cosecha-lote');if(lt)S.lote=lt;}catch(e){}

const ICONS={
 tolva:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-3 9H7z"/><path d="M8 8V5h8v3"/><circle cx="8" cy="20" r="1.5"/><circle cx="16" cy="20" r="1.5"/></svg>',
 camiones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h11v10H2z"/><path d="M13 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>',

 ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 datos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>'
};
const TABS=[['tolva','Tolva'],['camiones','Camiones'],['resumen','Resumen'],['datos','Exportar'],['ajustes','Ajustes']];

function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400);}
function fail(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Se llenó la base: exportá y archivá camiones viejos.':'No se pudo guardar. Revisá la señal y probá de nuevo.');}

/* ---------- derived data ---------- */
const lotes=()=>S.cfg?.lotes||[];
const socios=()=>S.cfg?.socios||[];
const loteById=id=>lotes().find(l=>l.id===id);
const socioById=id=>socios().find(s=>s.id===id);
const abierto=()=>S.camiones.filter(c=>c.estado==='abierto').sort((a,b)=>(b.nro||0)-(a.nro||0))[0]||null;
const tolvasDe=cid=>S.tolvas.filter(x=>x.camionId===cid).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
const kgCampo=c=>tolvasDe(c.id).reduce((s,x)=>s+(+x.kg||0),0);
const mermas=c=>{const m=c.planta||{};return ['mHumedad','mZaranda','mCalidad','mVolatil','mOtras'].reduce((s,k)=>s+(+m[k]||0),0)};
const netoPlanta=c=>{const d=+c.planta?.kgDescargados;return d?d-mermas(c):null};
function difPct(c){const d=+c.planta?.kgDescargados,k=kgCampo(c);if(!d||!k)return null;return (d-k)/k*100;}
function difPill(p){if(p==null)return '';const a=Math.abs(p);const cls=a<=1?'p-ok':a<=2.5?'p-warn':'p-bad';return `<span class="pill ${cls}">${p>0?'+':''}${fmt(p,1)}% vs campo</span>`;}
function sugerido(extraKg){
  const cerr=S.camiones.filter(c=>c.estado!=='abierto'&&c.empresa);
  const tot=cerr.reduce((s,c)=>s+kgCampo(c),0)+(extraKg||0);
  let best=null,bd=-Infinity;
  socios().forEach(s=>{const asig=cerr.filter(c=>c.empresa===s.id).reduce((a,c)=>a+kgCampo(c),0);const d=(s.pct/100)*tot-asig;if(d>bd){bd=d;best=s.id}});
  return best;
}
function porLote(){
  const r={};lotes().forEach(l=>r[l.id]={kg:0,neto:0});
  S.tolvas.forEach(x=>{if(r[x.lote])r[x.lote].kg+=(+x.kg||0)});
  S.camiones.forEach(c=>{if(c.estado!=='aprobado')return;const n=netoPlanta(c);if(n==null)return;const k=kgCampo(c);if(!k)return;tolvasDe(c.id).forEach(x=>{if(r[x.lote])r[x.lote].neto+=n*(+x.kg||0)/k})});
  return r;
}
function porSocio(){
  const cerr=S.camiones.filter(c=>c.estado!=='abierto'&&c.empresa);
  const tot=cerr.reduce((s,c)=>s+kgCampo(c),0);
  return {tot,rows:socios().map(s=>{const asig=cerr.filter(c=>c.empresa===s.id).reduce((a,c)=>a+kgCampo(c),0);return {s,asig,obj:(s.pct/100)*tot,neto:cerr.filter(c=>c.empresa===s.id&&c.estado==='aprobado').reduce((a,c)=>a+(netoPlanta(c)||0),0)}})};
}

async function doLogin(f){
  const email=($('#lg-user')?.value||'').trim();const password=$('#lg-pass')?.value||'';
  if(!email||!password){S.loginErr='Completá usuario y contraseña.';render();return;}
  S.loggingIn=true;S.loginErr='';render();
  try{await FB.auth.signInWithEmailAndPassword(email,password);}
  catch(e){S.loggingIn=false;S.loginErr='Usuario o contraseña incorrectos.';render();}
}
function render(){
  if(!S.authed){renderGate();return;}
  try{document.body.classList.remove('gated');}catch(_){}
  const _lo=$('#logout');if(_lo)_lo.style.display='';
  const _hd=$('header');if(_hd)_hd.style.display='';
  const _nv=document.querySelector('nav');if(_nv)_nv.style.display='';
  const _nb=$('.nav-brand img');if(_nb&&!_nb.getAttribute('src')){const _hl=$('.logo.light');if(_hl&&_hl.src)_nb.src=_hl.src;}

  if(S.cfg){$('#ctx').innerHTML=`<div class="ctxbar"><div class="ctx-proj"><b>${esc(S.cfg.proyecto)}</b> <span class="crop">${esc((S.cfg.cultivo||'').toUpperCase())}</span></div><div class="ctx-camp">Campaña ${esc(S.cfg.campana||'')}</div></div>`;}

  if(!S.cfg){v.innerHTML=`<div class="card"><h2>Configurá la cosecha</h2><p class="muted">Cargá el proyecto, los lotes con sus hectáreas y los socios con su porcentaje en Ajustes para empezar a registrar tolvas.</p><button class="btn" data-tab="ajustes" type="button">Ir a Ajustes</button></div>`;return;}
  v.innerHTML=(S.local?`<div class="testband" role="status" style="background:#FACA15;color:#1F2A37"><b>VISTA PREVIA</b> · datos de ejemplo en este navegador. La versión real (GitHub) usa la base compartida en la nube.</div>`:'')+(prueba()?`<div class="testband" role="status"><b>MODO PRUEBA</b> · lo que cargues acá no toca la cosecha real</div>`:'')+({tolva:vTolva,camiones:vCamiones,resumen:vResumen,datos:vDatos,ajustes:vAjustes}[S.tab]||vTolva)();
  const kgi=$('#kg');if(kgi&&S.focusKg){kgi.focus();S.focusKg=false;}
}

function tolvaRow(x){
  const editing=S.editTolva===x.id;const confirming=S.confirm===x.id;
  const head=`<div class="row"><span><b>${esc(loteById(x.lote)?.nombre||x.lote)}</b> <span class="muted">· ${hora(x.createdAt)}</span></span><b class="num">${fmt(x.kg)} kg</b></div>`;
  let actions;
  if(editing) actions=`<input type="number" inputmode="numeric" value="${esc(x.kg)}" aria-label="Kg tolva" data-kgedit="${x.id}" style="flex:1;min-width:90px;min-height:40px;padding:6px 10px;text-align:right"><button class="btn small accent" type="button" data-savekg="${x.id}">OK</button><button class="btn small ghost" type="button" data-canceledit>Cancelar</button>`;
  else if(confirming) actions=`<button class="btn small" type="button" data-deltolva="${x.id}" style="background:var(--bad);color:#fff">Sí, borrar</button><button class="btn small ghost" type="button" data-cancel>No</button>`;
  else actions=`<button class="btn small ghost" type="button" data-editkg="${x.id}">Editar kg</button><button class="btn small ghost" type="button" data-askdel="${x.id}">Borrar tolva</button>`;
  return `<div class="tolva-item">${head}<div class="tolva-actions">${actions}</div></div>`;
}
function vTolva(){
  const c=abierto();const tv=c?tolvasDe(c.id):[];const tot=tv.reduce((s,x)=>s+(+x.kg||0),0);

  const reg=`<div class="card col-reg"><span class="card-h">Registrar tolva</span>

    <div class="chips">${lotes().filter(l=>!(S.avance[l.id]?.cerrado)).map(l=>`<button type="button" class="chip" data-lote="${l.id}" aria-pressed="${S.lote===l.id}">${esc(l.nombre)}<small>${fmt(l.ha)} ha</small></button>`).join('')}</div>
    <label class="label" for="kg">2 · Kilos de la tolva</label>
    <input id="kg" class="kg" type="number" inputmode="numeric" min="0" step="10" placeholder="0" value="${esc(S.kg)}">

  </div>`;
  const cam=`<div class="col-cam">
    <div class="card dark"><div class="row"><span class="label">${c?`Camión ${c.nro} · cargando`:'Sin camión abierto'}</span><span class="label">${tv.length} tolva${tv.length===1?'':'s'}</span></div><div class="row"><span class="big">${fmt(tot)}</span><span class="muted">kg</span></div></div>
    ${c?`<div class="card"><span class="card-h">Tolvas de este camión</span><div class="list">${tv.length?tv.slice().reverse().map(tolvaRow).join(''):'<span class="muted" style="font-size:13px">Todavía no cargaste tolvas.</span>'}</div><button class="btn accent full" type="button" data-close="${c.id}" ${tv.length?'':'disabled'}>Cerrar camión y completar datos</button></div>`:`<div class="card"><span class="muted">La primera tolva abre un camión nuevo al registrar la primera carga.</span></div>`}
  </div>`;
  return `<h2>Registro de tolva</h2><div class="tolva-grid">${cam}${reg}</div>`;
}

function vCamiones(){
  if(S.edit)return vEditor();
  const cs=S.camiones.slice().sort((a,b)=>(b.nro||0)-(a.nro||0)).filter(c=>S.filter==='todos'||c.estado===S.filter);
  const n=k=>S.camiones.filter(c=>c.estado===k).length;
  const f=[['todos','Todos',S.camiones.length],['abierto','Cargando',n('abierto')],['viaje','En viaje',n('viaje')],['aprobado','Aprobados',n('aprobado')]];
  const EST={abierto:['Cargando','p-abierto'],viaje:['En viaje','p-viaje'],descargado:['A aprobar','p-desc'],aprobado:['Aprobado','p-aprob']};
  const lotesDe=c=>[...new Set(tolvasDe(c.id).map(x=>loteById(x.lote)?.nombre||x.lote))].join(', ');
  const cards=cs.length?cs.map(c=>{const est=EST[c.estado]||['','p-ok'];const lts=lotesDe(c);
    return `<button type="button" class="truck" data-open="${c.id}"><div class="row"><b>Camión ${c.nro} <span class="muted" style="font-weight:400">· ${dia(c.fecha)}</span></b><span class="pill ${est[1]}">${est[0]}</span></div>
    <div class="row"><span class="muted">${esc(lts||'—')}</span><b class="num">${fmt(kgCampo(c))} kg</b></div>
    <div class="row"><span class="muted">${esc(socioById(c.empresa)?.nombre||'Sin empresa')} → ${esc(c.destino||'sin destino')}${c.cpe?' · CPE '+esc(c.cpe):''}</span>${difPill(difPct(c))}</div></button>`}).join(''):`<div class="empty">Todavía no hay camiones. Se crean solos al registrar la primera tolva.</div>`;
  const rows=cs.length?cs.map(c=>{const est=EST[c.estado]||['','p-ok'];const lts=lotesDe(c);
    return `<tr><td><b>Camión ${c.nro}</b><div class="muted" style="font-size:12px">${dia(c.fecha)}</div></td><td><span class="pill ${est[1]}">${est[0]}</span></td><td>${esc(lts||'—')}</td><td><b class="num">${fmt(kgCampo(c))} kg</b></td><td>${esc(socioById(c.empresa)?.nombre||'Sin empresa')}<div class="muted" style="font-size:12px">→ ${esc(c.destino||'sin destino')}${c.cpe?' · CPE '+esc(c.cpe):''}</div></td><td><button class="btn small ghost" type="button" data-open="${c.id}">Ver detalle</button></td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">Todavía no hay camiones. Se crean solos al registrar la primera tolva.</div></td></tr>`;
  return `<div style="display:flex;flex-direction:column;gap:16px"><h2>Camiones</h2>
  <div class="filters">${f.map(([k,l,c])=>`<button type="button" class="chip" style="min-height:40px;flex-direction:row;gap:6px" data-filter="${k}" aria-pressed="${S.filter===k}">${l} <small>${c}</small></button>`).join('')}</div>
  <div class="card mob-only" style="padding-block:4px">${cards}</div>
  <div class="card desk-only" style="padding:8px"><div class="tw"><table class="cam-table"><thead><tr><th>Camión</th><th>Estado</th><th>Lote</th><th>Kilos campo</th><th>Empresa y destino</th><th>Detalle</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  </div>`;
}

function vResumen(){
  const pl=porLote();const ps=porSocio();
  const kgT=S.tolvas.reduce((s,x)=>s+(+x.kg||0),0);
  const aprob=S.camiones.filter(c=>c.estado==='aprobado');const pend=S.camiones.filter(c=>c.estado==='descargado').length;
  const netoT=aprob.reduce((s,c)=>s+(netoPlanta(c)||0),0);
  const desc=S.camiones.filter(c=>c.estado==='descargado'||c.estado==='aprobado');const desK=desc.reduce((s,c)=>s+kgCampo(c),0);const desP=desc.reduce((s,c)=>s+(+c.planta?.kgDescargados||0),0);
  const mer=desc.reduce((s,c)=>s+mermas(c),0);
  const haC=lotes().reduce((s,l)=>s+(+S.avance[l.id]?.haCosechadas||0),0);
  const alerts=S.camiones.filter(c=>{const d=difPct(c);return d!=null&&Math.abs(d)>2.5}).length;
  const sinCpe=S.camiones.filter(c=>c.estado!=='abierto'&&!c.cpe).length;
  let totHa=0,totK=0,totN=0;
  const rows=lotes().map(l=>{const a=S.avance[l.id]||{};const r=pl[l.id];const hc=+a.haCosechadas||0;totHa+=hc;totK+=r.kg;totN+=r.neto;
    return `<tr><td><b>${esc(l.nombre)}</b><div class="muted" style="font-size:12px">${fmt(l.ha)} ha${a.cerrado?' · <span class="pill p-desc">cerrado</span>':''}</div></td>
    <td><input aria-label="Hectáreas cosechadas ${esc(l.nombre)}" data-ha="${l.id}" type="number" inputmode="decimal" value="${esc(a.haCosechadas??'')}" style="width:76px;min-height:38px;padding:6px 8px;text-align:right"></td>
    <td>${t(r.kg)}</td><td><b>${hc?fmt(r.kg/hc/1000,2):'—'}</b></td><td>${r.neto?t(r.neto):'—'}</td><td>${hc&&r.neto?fmt(r.neto/hc/1000,2):'—'}</td>
    <td><button type="button" class="btn small ghost" data-cerrar="${l.id}">${a.cerrado?'Reabrir':'Cerrar'}</button></td></tr>`}).join('');
  return `<div style="display:flex;flex-direction:column;gap:16px"><h2>Resumen unificado de cosecha</h2>
  ${alerts||sinCpe?`<div class="banner">${alerts?`${alerts} camión${alerts>1?'es':''} con diferencia campo-planta mayor a 2,5%. `:''}${sinCpe?`${sinCpe} despachado${sinCpe>1?'s':''} sin carta de porte cargada.`:''}</div>`:''}
  <div class="grid2 kpis">
    <div class="card dark"><span class="label">Toneladas cargadas en campo</span><span class="big">${t(kgT)}</span><span class="muted">${S.tolvas.length} tolvas · ${S.camiones.length} camiones</span></div>
    <div class="card"><span class="label">Toneladas descargadas en planta</span><span class="big">${t(netoT)}</span><span class="muted">${aprob.length} aprobados${pend?` · <b style="color:var(--warn)">${pend} a aprobar</b>`:''}</span></div>
    <div class="card"><span class="label">Diferencia campo-acopio</span><span class="big" style="font-size:32px">${desK?t(desK-desP):'—'}<span class="muted" style="font-size:14px;font-weight:400"> TN${desK?' · '+fmt((desK-desP)/desK*100,1)+'%':''}</span></span><span class="muted">campo − planta · sobre descargados</span></div>
    <div class="card"><span class="label">Mermas</span><span class="big" style="font-size:32px">${t(mer)}<span class="muted" style="font-size:14px;font-weight:400"> TN${desP?' · '+fmt(mer/desP*100,1)+'%':''}</span></span><span class="muted">de lo descargado</span></div>
    <div class="card"><span class="label">Ha cosechadas</span><span class="big" style="font-size:32px">${fmt(haC)}</span><span class="muted">hectáreas</span></div>
  </div>
  <div class="card"><div class="row"><span class="label">Por lote · TN/ha</span><span class="muted" style="font-size:12px">Cargá las ha cosechadas</span></div>
  <div class="tw"><table><thead><tr><th>Lote</th><th>Ha cos.</th><th>TN campo</th><th>Rinde campo</th><th>TN planta</th><th>Rinde acopio</th><th></th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Total</td><td>${fmt(totHa)}</td><td>${t(totK)}</td><td>${totHa?fmt(totK/totHa/1000,2):'—'}</td><td>${totN?t(totN):'—'}</td><td>${totHa&&totN?fmt(totN/totHa/1000,2):'—'}</td><td></td></tr></tbody></table></div>
  <span class="muted" style="font-size:12px">TN campo y rinde campo incluyen todas las tolvas (avance en vivo). TN planta y rinde acopio cuentan solo camiones aprobados, repartidos entre lotes según los kilos de tolva. Rinde en TN/ha.</span></div>
  <div class="card"><span class="label">Por socio · cargado vs. porcentaje</span>
  ${ps.rows.map(r=>{const pc=ps.tot?r.asig/ps.tot*100:0;const dv=(r.asig-r.obj)/1000;return `<div style="display:flex;flex-direction:column;gap:6px"><div class="row"><b>${esc(r.s.nombre)} <span class="muted" style="font-weight:400">· objetivo ${fmt(r.s.pct)}%</span></b><span class="num">${t(r.asig)} TN · ${fmt(pc,1)}%</span></div>

async function pruebaAccion(kind){
  S.pconfirm=null;toast(kind==='borrar'?'Borrando prueba…':'Pasando prueba a real…');
  try{
    if(kind==='pasar'){
      let nro=S.R.camiones.reduce((m,c)=>Math.max(m,c.nro||0),0);
      for(const c of S.P.camiones.slice().sort((a,b)=>a.nro-b.nro)){const {id,...b}=c;await S.db.doc('camiones/'+id).set({...b,nro:++nro,origen:'prueba'});}
      for(const x of S.P.tolvas){const {id,...b}=x;await S.db.doc('tolvas/'+id).set(b);}
      for(const [id,a] of Object.entries(S.P.avance)){if(!S.R.avance[id])await S.db.doc('avance/'+id).set(a);}
    }
    for(const x of S.P.tolvas)await S.db.doc('p_tolvas/'+x.id).delete();
    for(const c of S.P.camiones)await S.db.doc('p_camiones/'+c.id).delete();
    for(const id of Object.keys(S.P.avance))await S.db.doc('p_avance/'+id).delete();
    if(kind==='pasar')await S.db.doc('config/main').update({modoPrueba:false});
    toast(kind==='borrar'?'Prueba borrada':'La prueba pasó a la cosecha real');
  }catch(e){fail(e);}
  render();
}

  lotes().forEach(l=>{const a=S.avance[l.id]||{};const hc=n(a.haCosechadas);R.push([l.nombre,l.ha,hc,r1(pl[l.id].kg),hc?r1(pl[l.id].kg/hc):null,r1(pl[l.id].neto),hc&&pl[l.id].neto?r1(pl[l.id].neto/hc):null,a.cerrado?'Cerrado':'En cosecha'])});
  R.push([],['POR SOCIO'],['Socio','% objetivo','Kg cargados (despachados)','% real','Kg objetivo','Desvío kg','Kg neto aprobado']);
  ps.rows.forEach(r=>R.push([r.s.nombre,r.s.pct,r1(r.asig),ps.tot?+(r.asig/ps.tot*100).toFixed(1):null,r1(r.obj),r1(r.asig-r.obj),r1(r.neto)]));

  S.camiones.slice().sort((a,b)=>a.nro-b.nro).forEach(c=>{const p=c.planta||{};const d=difPct(c);C.push([c.nro,c.fecha,estTxt[c.estado]||c.estado,[...new Set(tolvasDe(c.id).map(x=>loteById(x.lote)?.nombre||x.lote))].join(' + '),kgCampo(c),socioById(c.empresa)?.nombre||'',c.destino||'',c.patente||'',c.transporte||'',c.cpe||'',p.ticket||'',p.fechaDesc||'',n(p.kgDescargados),n(p.mHumedad),n(p.mZaranda),n(p.mCalidad),n(p.mVolatil),n(p.mOtras),n(p.humedadPct),netoPlanta(c),d==null?null:+d.toFixed(2),c.aprobadoPor?quien(c.aprobadoPor):'',c.aprobadoAt?c.aprobadoAt.slice(0,10):''])});
  // Hoja 4: tolvas
  const nro=id=>S.camiones.find(c=>c.id===id)?.nro??'';
  const T=[['Fecha','Hora','Lote','Kg tolva','N° camión']];

  const wb=X.utils.book_new();

// Descarga robusta: 1) capacidad nativa  2) link de descarga estándar (anda en celular)
async function dlFile(filename,blob){
  // Descarga directa del navegador (funciona para todos en una web normal como GitHub Pages).
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(url);a.remove();}catch(_){}},2000);return true;}catch(e){}
  return false;
}

const DEFAULT_CFG={proyecto:'Laguna Blanca 26-27',cultivo:'Trigo',campana:'2026-27',modoPrueba:false,
 lotes:[{id:'r2',nombre:'R2',ha:156},{id:'r1-norte',nombre:'R1 Norte',ha:39},{id:'j2-sur',nombre:'J2 Sur',ha:70},{id:'j3',nombre:'J3',ha:54},{id:'r1-sur-zorro',nombre:'R1 Sur (Zorro)',ha:20},{id:'r2-leo-zorro',nombre:'R2 Leo (Zorro)',ha:47},{id:'ubeda-zorro',nombre:'Ubeda (Zorro)',ha:20}],
 socios:[{id:'laguna-blanca-srl',nombre:'Laguna Blanca SRL',pct:50},{id:'soalen-srl',nombre:'Soalen SRL',pct:25},{id:'cef-srl',nombre:'CEF SRL',pct:25}],
 opciones:{destinos:['AGD','Bunge'],transportes:['Vizgarra','Ruiz','Transporte Global','Pujato','Sevilla','Bustos','Trapiche']}};
function LocalDB(){
  const KEY='ponti-cosecha-local-v1';let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){store={}}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));S.localOk=true}catch(_){S.localOk=false}};
  const subs=[];const clone=d=>JSON.parse(JSON.stringify(d));
  const dsnap=p=>({id:p.split('/').pop(),exists:p in store,data:()=>store[p]});
  const csnap=c=>{const n=c.split('/').length+1;const docs=Object.keys(store).filter(k=>k.startsWith(c+'/')&&k.split('/').length===n).sort().map(dsnap);return {docs,size:docs.length,empty:!docs.length}};
  const emit=()=>subs.forEach(x=>x.fn(x.doc?dsnap(x.path):csnap(x.path)));
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const dref=p=>({id:p.split('/').pop(),path:p,
    get:async()=>dsnap(p),
    set:async d=>{store[p]=clone(d);save();setTimeout(emit)},
    update:async d=>{if(!(p in store))throw {code:'invalid_argument'};store[p]={...store[p],...clone(d)};save();setTimeout(emit)},
    delete:async()=>{delete store[p];save();setTimeout(emit)},
    onSnapshot:fn=>{subs.push({doc:true,path:p,fn});setTimeout(()=>fn(dsnap(p)));return ()=>{}}});
  const cref=c=>({path:c,doc:id=>dref(c+'/'+(id||nid())),add:async d=>{const r=dref(c+'/'+nid());await r.set(d);return r},
    onSnapshot:fn=>{subs.push({doc:false,path:c,fn});setTimeout(()=>fn(csnap(c)));return ()=>{}}});
  if(!store['config/main']){store['config/main']=clone(DEFAULT_CFG);save();}else save();
  return {doc:dref,collection:cref,local:true};
}
function tecnico(){try{return localStorage.getItem('ponti-cosecha-tecnico')||''}catch(_){return ''}}
function buildEnvio(){
  const nro=id=>S.camiones.find(c=>c.id===id)?.nro;
  const est={abierto:'Cargando',viaje:'En viaje',descargado:'Descargado',aprobado:'Aprobado'};
  const L=[`PONTI COSECHA · ${S.cfg.proyecto} · ${S.cfg.cultivo}`,`Enviado por: ${tecnico()||'sin nombre'} · ${new Date().toLocaleString('es-AR')}`,`Tolvas: ${S.tolvas.length} · Camiones: ${S.camiones.length} · Kg campo: ${fmt(S.tolvas.reduce((a,x)=>a+(+x.kg||0),0))}`,''];
  S.camiones.slice().sort((a,b)=>a.nro-b.nro).forEach(c=>{const p=c.planta||{};L.push(`CAMIÓN ${c.nro} · ${dia(c.fecha)} · ${est[c.estado]||c.estado} · ${fmt(kgCampo(c))} kg campo`);
    tolvasDe(c.id).forEach(x=>L.push(`  - ${hora(x.createdAt)} ${loteById(x.lote)?.nombre||x.lote}: ${fmt(x.kg)} kg`));
    if(c.empresa||c.destino)L.push(`  Empresa: ${socioById(c.empresa)?.nombre||'—'} → ${c.destino||'—'} · Patente ${c.patente||'—'} · CPE ${c.cpe||'—'}`);
    if(p.kgDescargados)L.push(`  Planta: ${fmt(p.kgDescargados)} kg desc. · mermas ${fmt(mermas(c))} kg · neto ${fmt(netoPlanta(c))} kg · hum ${p.humedadPct??'—'}%`);});
  const data={v:1,tecnico:tecnico(),proyecto:S.cfg.proyecto,enviado:new Date().toISOString(),tolvas:S.tolvas.map(x=>({...x,camionNro:nro(x.camionId)})),camiones:S.camiones,avance:S.avance};
  L.push('','— No borrar lo de abajo: es para cargar en la app —','PONTI-DATA:'+JSON.stringify(data));
  return L.join('\n');
}
async function importar(txt){
  const i=txt.indexOf('PONTI-DATA:');if(i<0){toast('No encontré los datos. Pegá el mensaje completo.');return;}
  let d;try{d=JSON.parse(txt.slice(i+11).trim().split('\n')[0])}catch(_){toast('Los datos están incompletos. Pedí que lo reenvíen.');return;}
  try{
    let nro=S.camiones.reduce((m,c)=>Math.max(m,c.nro||0),0);const map={};
    for(const c of (d.camiones||[]).slice().sort((a,b)=>a.nro-b.nro)){const {id,...b}=c;const ref=S.db.collection(col('camiones')).doc();map[id]=ref.id;await ref.set({...b,nro:++nro,nroCampo:c.nro,origen:'campo-local',tecnico:d.tecnico||'',estado:b.estado==='aprobado'?'descargado':b.estado});}
    for(const x of (d.tolvas||[])){const {id,camionNro,...b}=x;await S.db.collection(col('tolvas')).add({...b,camionId:map[x.camionId]||null,tecnico:d.tecnico||''});}
    toast(`Importados ${(d.camiones||[]).length} camiones y ${(d.tolvas||[]).length} tolvas de ${d.tecnico||'campo'}`);S.importTxt='';render();
  }catch(e){fail(e);}
}

/* ---------- boot ---------- */
render();
(function(){
  let got=0;const N=7;let started=false;
  const onErr=e=>{console.error(e);};
  const busy=()=>{const a=document.activeElement;return a&&a.matches&&a.matches('input,textarea,select')&&a.id!=='kg';};
  const safeRender=()=>{if(S.ready&&busy())return;render();};
  const step=()=>{if(got<N){got++;if(got>=N)S.ready=true;render();}else safeRender();};
  async function startData(){
    if(started)return;started=true;
    const db=S.db;
    try{const cs=await db.doc('config/main').get();if(!cs.exists)await db.doc('config/main').set(DEFAULT_CFG);}catch(e){console.error(e);}
    db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.ready=true;syncMode();render();},onErr);
    [['',S.R],['p_',S.P]].forEach(([pre,box])=>{
      db.collection(pre+'tolvas').onSnapshot(s=>{box.tolvas=s.docs.map(d=>({...d.data(),id:d.id}));S.ready=true;syncMode();safeRender();},onErr);
      db.collection(pre+'camiones').onSnapshot(s=>{box.camiones=s.docs.map(d=>({...d.data(),id:d.id}));S.ready=true;syncMode();safeRender();},onErr);
      db.collection(pre+'avance').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());box.avance=o;S.ready=true;syncMode();safeRender();},onErr);
    });
  }
  if(FB&&FB.auth){
    FB.auth.onAuthStateChanged(function(u){
      S.authChecked=true;
      if(u){S.authed=true;S.uid=u.uid;S.db=FB.db;startData();render();}
      else{S.authed=false;S.uid=null;render();}
    });
  } else {
    // Sin Firebase (vista previa en Claude, o SDK no disponible): modo local de ejemplo, sin login.
    S.authChecked=true;S.authed=true;S.local=true;S.uid='local';S.db=LocalDB();startData();render();
  }
})();
})();
</script>
